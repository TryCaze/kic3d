<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Kic 3D</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Checkout Page Styles */
        .checkout-wrapper {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .checkout-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .checkout-summary {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(108, 92, 231, 0.2);
            position: sticky;
            top: 100px;
            height: fit-content;
        }

        .checkout-summary h3 {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: var(--primary-hover);
            border-bottom: 2px solid rgba(108, 92, 231, 0.2);
            padding-bottom: 12px;
        }

        .checkout-items {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 25px;
        }

        .checkout-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .checkout-item-info {
            flex: 2;
        }

        .checkout-item-name {
            font-weight: 500;
            margin-bottom: 4px;
        }

        .checkout-item-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .checkout-item-price {
            font-weight: 600;
            color: var(--primary-hover);
            text-align: right;
        }

        .checkout-total-row {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            font-size: 1.2rem;
            border-top: 2px solid rgba(108, 92, 231, 0.3);
            margin-top: 10px;
        }

        .checkout-total-row.total {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-hover);
            border-top-color: var(--primary);
        }

        .checkout-form {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(108, 92, 231, 0.2);
        }

        .checkout-form h3 {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: var(--primary-hover);
            border-bottom: 2px solid rgba(108, 92, 231, 0.2);
            padding-bottom: 12px;
        }

        .form-row {
            margin-bottom: 20px;
        }

        .form-row label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }

        .form-row input,
        .form-row textarea,
        .form-row select {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid rgba(108, 92, 231, 0.3);
            background: var(--dark);
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }

        .form-row input:focus,
        .form-row textarea:focus,
        .form-row select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(108, 92, 231, 0.2);
        }

        .form-row textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row-half {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-row-half > div {
            width: 100%;
        }

        .form-row-half input,
        .form-row-half select {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid rgba(108, 92, 231, 0.3);
            background: var(--dark);
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            box-sizing: border-box;
        }

        .form-row-half input:focus,
        .form-row-half select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(108, 92, 231, 0.2);
        }

        .form-row-half label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }

        .payment-methods {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .payment-method {
            flex: 1;
        }

        .payment-method input {
            display: none;
        }

        .payment-method label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            background: var(--dark);
            border: 1px solid rgba(108, 92, 231, 0.3);
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
            margin: 0;
        }

        .payment-method input:checked + label {
            border-color: var(--primary);
            background: rgba(108, 92, 231, 0.15);
        }

        .payment-method label i {
            font-size: 1.2rem;
        }

        .btn-checkout {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-checkout:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .back-to-cart {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 20px;
            transition: var(--transition);
        }

        .back-to-cart:hover {
            color: var(--primary);
        }

        @media (max-width: 768px) {
            .checkout-grid {
                grid-template-columns: 1fr;
            }
            
            .checkout-summary {
                position: static;
                order: 2;
            }
            
            .checkout-form {
                order: 1;
            }
            
            .form-row-half {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="checkout-wrapper">
        <a href="/kosarica.html" class="back-to-cart">
            <i class="fas fa-arrow-left"></i> Povratak u košaricu
        </a>

        <div class="checkout-grid">
            <!-- Lijeva strana: Forma za unos podataka -->
            <div class="checkout-form">
                <h3><i class="fas fa-user-edit"></i> Podaci za dostavu</h3>
                
                <form id="checkout-form">
                    <div class="form-row">
                        <label for="fullname">Puno ime i prezime *</label>
                        <input type="text" id="fullname" name="fullname" required placeholder="npr. Ivan Horvat">
                    </div>

                    <div class="form-row">
                        <label for="email">Email adresa *</label>
                        <input type="email" id="email" name="email" required placeholder="ivan@example.com">
                    </div>

                    <div class="form-row">
                        <label for="phone">Telefon *</label>
                        <input type="tel" id="phone" name="phone" required placeholder="099 123 4567">
                    </div>

                    <div class="form-row">

                        <label for="address">Adresa dostave *</label>
                        <input type="text" id="address" name="address" required placeholder="Ulica i kućni broj">
                    </div>

                    <div class="form-row-half">
                        <div>
                            <label for="city">Grad *</label>
                            <input type="text" id="city" name="city" required placeholder="Požega">
                        </div>
                        <div>
                            <label for="zip">Poštanski broj *</label>
                            <input type="text" id="zip" name="zip" required placeholder="34000">
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="notes">Napomena (opcionalno)</label>
                        <textarea id="notes" name="notes" placeholder="Dodatne informacije za dostavu..."></textarea>
                    </div>

                    <div class="form-row">
                        <label>Način plaćanja *</label>
                        <div class="payment-methods">
                            <div class="payment-method">
                                <input type="radio" name="payment" id="payment-card" value="kartica" checked>
                                <label for="payment-card">
                                    <i class="fas fa-credit-card"></i> Kartica
                                </label>
                            </div>
                            <div class="payment-method">
                                <input type="radio" name="payment" id="payment-paypal" value="paypal">
                                <label for="payment-paypal">
                                    <i class="fab fa-paypal"></i> PayPal
                                </label>
                            </div>
                            <div class="payment-method">
                                <input type="radio" name="payment" id="payment-cod" value="pouzece">
                                <label for="payment-cod">
                                    <i class="fas fa-money-bill-wave"></i> Plaćanje pouzećem
                                </label>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn-checkout">
                        <i class="fas fa-check-circle"></i> Završi narudžbu
                    </button>
                </form>
            </div>

            <!-- Desna strana: Pregled košarice -->
            <div class="checkout-summary">
                <h3><i class="fas fa-shopping-basket"></i> Pregled narudžbe</h3>
                <div id="checkout-items-list" class="checkout-items">
                    <!-- Stavke će se učitati dinamički -->
                    <div style="text-align: center; padding: 20px;">Učitavanje...</div>
                </div>
                <div id="checkout-total">
                    <!-- Ukupno će se učitati dinamički -->
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script type="module">
        import { getNavbar } from './components/nav.js';
        import { getFooter } from './components/footer.js';
        import { updateCartBadge, getCart } from './js/cart.js';

        getNavbar();
        getFooter();
        updateCartBadge();

        // Prikaz košarice na checkout stranici
        function renderCheckoutSummary() {
            const cart = getCart();
            const itemsContainer = document.getElementById('checkout-items-list');
            const totalContainer = document.getElementById('checkout-total');
            
            if (!itemsContainer) return;
            
            if (cart.length === 0) {
                itemsContainer.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--text-muted);">Vaša košarica je prazna.</div>';
                totalContainer.innerHTML = '';
                return;
            }
            
            let itemsHtml = '';
            let total = 0;
            
            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                
                itemsHtml += `
                    <div class="checkout-item">
                        <div class="checkout-item-info">
                            <div class="checkout-item-name">${escapeHtml(item.label)}</div>
                            <div class="checkout-item-meta">Količina: ${item.quantity} × €${item.price.toFixed(2)}</div>
                        </div>
                        <div class="checkout-item-price">€${itemTotal.toFixed(2)}</div>
                    </div>
                `;
            });
            
            // Dodaj trošak dostave (besplatna dostava iznad 50€)
            const shippingCost = total > 50 ? 0 : 4.99;
            const grandTotal = total + shippingCost;
            
            itemsContainer.innerHTML = itemsHtml;
            
            totalContainer.innerHTML = `
                <div class="checkout-total-row">
                    <span>Međuzbroj:</span>
                    <span>€${total.toFixed(2)}</span>
                </div>
                <div class="checkout-total-row">
                    <span>Dostava:</span>
                    <span>${shippingCost === 0 ? 'BESPLATNO' : '€' + shippingCost.toFixed(2)}</span>
                </div>
                <div class="checkout-total-row total">
                    <span>Ukupno za platiti:</span>
                    <span>€${grandTotal.toFixed(2)}</span>
                </div>
            `;
        }
        
        // Helper za escape HTML
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // Generiranje broja narudžbe
        function generateOrderNumber() {
            const timestamp = Date.now();
            const random = Math.floor(Math.random() * 1000);
            return `KIC-${timestamp}-${random}`;
        }
        
        // Spremanje narudžbe u localStorage
        function saveOrder(orderData) {
            const orders = JSON.parse(localStorage.getItem('kic_orders') || '[]');
            orders.unshift(orderData); // Nova narudžba na početak
            localStorage.setItem('kic_orders', JSON.stringify(orders));
        }
        
        // Slanje narudžbe
        document.getElementById('checkout-form').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const cart = getCart();
            
            if (cart.length === 0) {
                alert('Vaša košarica je prazna!');
                window.location.href = '/trgovina.html';
                return;
            }
            
            // Prikupljanje podataka iz forme
            const fullname = document.getElementById('fullname').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const address = document.getElementById('address').value.trim();
            const city = document.getElementById('city').value.trim();
            const zip = document.getElementById('zip').value.trim();
            const notes = document.getElementById('notes').value.trim();
            const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
            
            // Računanje ukupnog iznosa
            let subtotal = 0;
            cart.forEach(item => {
                subtotal += item.price * item.quantity;
            });
            const shippingCost = subtotal > 50 ? 0 : 4.99;
            const totalAmount = subtotal + shippingCost;
            
            // Kreiranje objekta narudžbe
            const orderNumber = generateOrderNumber();
            const orderDate = new Date().toISOString();
            
            const order = {
                orderNumber: orderNumber,
                orderDate: orderDate,
                customer: {
                    fullname: fullname,
                    email: email,
                    phone: phone,
                    address: address,
                    city: city,
                    zip: zip,
                    notes: notes
                },
                items: cart.map(item => ({
                    id: item.value,
                    name: item.label,
                    quantity: item.quantity,
                    price: item.price,
                    total: item.price * item.quantity
                })),
                subtotal: subtotal,
                shippingCost: shippingCost,
                totalAmount: totalAmount,
                paymentMethod: paymentMethod,
                status: 'pending'
            };
            
            // Spremanje narudžbe
            saveOrder(order);
            
            // Brisanje košarice nakon uspješne narudžbe
            localStorage.removeItem('cart_guest');
            
            // Spremanje podataka o narudžbi za potvrdu
            sessionStorage.setItem('lastOrder', JSON.stringify(order));
            
            // Preusmjeravanje na stranicu s potvrdom
            window.location.href = '/narudzba-potvrda.html';
        });
        
        // Inicijalno prikazivanje košarice
        renderCheckoutSummary();
    </script>
</body>
</html>
